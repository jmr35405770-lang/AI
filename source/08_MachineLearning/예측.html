<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울특별시 25개 구 실시간 유동인구 & AI 인구밀집 예측 관제 센터</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #080c14;
            --card-bg: rgba(15, 23, 42, 0.82);
            --card-border: rgba(255, 255, 255, 0.09);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            
            --color-green: #10b981;
            --color-yellow: #f59e0b;
            --color-red: #ef4444;
            --color-blue: #3b82f6;
            --color-purple: #a855f7;
            --color-cyan: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 50% 0%, rgba(59, 130, 246, 0.16) 0px, transparent 65%),
                radial-gradient(at 80% 50%, rgba(168, 85, 247, 0.12) 0px, transparent 60%),
                radial-gradient(at 20% 100%, rgba(239, 68, 68, 0.14) 0px, transparent 65%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2.5rem 0;
        }

        .dashboard-wrapper {
            max-width: 1420px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Center Aligned Header */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-bottom: 2.2rem;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            margin-bottom: 1.2rem;
        }

        .brand-icon {
            font-size: 2.8rem;
            color: var(--color-blue);
            background: rgba(59, 130, 246, 0.15);
            padding: 1.1rem;
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.35);
        }

        .brand-text h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .brand-text h1 span {
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .header-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .live-badge {
            background: rgba(239, 68, 68, 0.15);
            color: var(--color-red);
            border: 1px solid rgba(239, 68, 68, 0.35);
            padding: 0.45rem 1.1rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .live-badge .dot {
            width: 8px;
            height: 8px;
            background-color: var(--color-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--color-red);
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .clock {
            font-size: 0.95rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            padding: 0.45rem 1.1rem;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }

        /* Center Aligned Summary Cards Grid */
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 1.4rem 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(14px);
            transition: all 0.25s ease;
        }

        .summary-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .sc-icon {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: var(--color-blue);
        }

        .summary-card.danger .sc-icon { color: var(--color-red); }
        .summary-card.warning .sc-icon { color: var(--color-yellow); }
        .summary-card.purple .sc-icon { color: var(--color-purple); }
        .summary-card.cyan .sc-icon { color: var(--color-cyan); }
        .summary-card.success .sc-icon { color: var(--color-green); }

        .sc-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .sc-val {
            font-size: 1.75rem;
            font-weight: 800;
            margin-top: 0.3rem;
            color: var(--text-primary);
        }

        .summary-card.danger .sc-val { color: var(--color-red); }
        .summary-card.warning .sc-val { color: var(--color-yellow); }
        .summary-card.purple .sc-val { color: var(--color-purple); }
        .summary-card.cyan .sc-val { color: var(--color-cyan); }
        .summary-card.success .sc-val { color: var(--color-green); }

        /* Control Panel */
        .control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 2.5rem;
            max-width: 980px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-wrap {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrap i {
            position: absolute;
            left: 1.4rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .search-wrap input {
            width: 100%;
            padding: 1.1rem 1.2rem 1.1rem 3.4rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 1.02rem;
            outline: none;
            transition: all 0.2s ease;
            text-align: center;
        }

        .search-wrap input::placeholder {
            text-align: center;
            color: #64748b;
        }

        .search-wrap input:focus {
            border-color: var(--color-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18);
            background: rgba(22, 32, 54, 0.95);
        }

        .filter-wrap {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            flex-wrap: wrap;
        }

        .filter-wrap select {
            flex: 1;
            min-width: 180px;
            padding: 0.9rem 1.1rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.92rem;
            outline: none;
            cursor: pointer;
            text-align-last: center;
            transition: all 0.2s;
        }

        .filter-wrap select:focus {
            border-color: var(--color-blue);
        }

        /* District Card Grid */
        .district-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
            gap: 1.6rem;
        }

        .district-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .district-card.accident-danger-card {
            border-color: rgba(239, 68, 68, 0.45);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.18);
        }

        .district-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.85rem;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .district-title {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
        }

        .district-name {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .zone-tag {
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 9px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .risk-badge {
            padding: 0.38rem 0.85rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .risk-badge.low { background: rgba(16, 185, 129, 0.15); color: var(--color-green); border: 1px solid rgba(16, 185, 129, 0.35); }
        .risk-badge.medium { background: rgba(245, 158, 11, 0.15); color: var(--color-yellow); border: 1px solid rgba(245, 158, 11, 0.35); }
        .risk-badge.high { background: rgba(239, 68, 68, 0.15); color: var(--color-red); border: 1px solid rgba(239, 68, 68, 0.35); }

        /* Floating Population Banner & Alert */
        .pop-banner {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pop-banner.danger {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.35);
        }

        .pop-banner.warning {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .pop-info {
            display: flex;
            flex-direction: column;
        }

        .pop-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pop-value-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-top: 2px;
        }

        .pop-value {
            font-size: 1.18rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .trend-delta {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .trend-delta.up { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .trend-delta.down { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }

        .accident-alert-banner {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.25), rgba(245, 158, 11, 0.25));
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 0.5rem 0.8rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 0.85rem;
            animation: pulseBanner 2s infinite ease-in-out;
        }

        @keyframes pulseBanner {
            0%, 100% { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
            50% { border-color: rgba(239, 68, 68, 0.9); box-shadow: 0 0 18px rgba(239, 68, 68, 0.4); }
        }

        /* 24-Hour Population Prediction Chart Section */
        .chart-toggle-btn {
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 0.6rem;
            padding: 0.65rem;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.28);
            color: #c084fc;
            border-radius: 12px;
            font-size: 0.83rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chart-toggle-btn:hover {
            background: rgba(168, 85, 247, 0.22);
            color: #ffffff;
            border-color: rgba(168, 85, 247, 0.5);
        }

        .prediction-box {
            display: none;
            background: rgba(8, 12, 20, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 14px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }

        .prediction-box.open {
            display: block;
        }

        .peak-tags-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 0.78rem;
        }

        .peak-tag {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        /* Sparkline Bar Chart Matrix */
        .bars-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 68px;
            gap: 3px;
            padding: 4px 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            position: relative;
            cursor: pointer;
        }

        .bar-fill {
            width: 100%;
            background: rgba(59, 130, 246, 0.45);
            border-radius: 3px 3px 0 0;
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bar-col.now .bar-fill {
            background: linear-gradient(180deg, #ef4444, #f59e0b);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        .bar-col.peak .bar-fill {
            background: linear-gradient(180deg, #a855f7, #3b82f6);
        }

        .bar-col:hover .bar-fill {
            background: #60a5fa;
        }

        /* Tooltip on bar hover */
        .bar-col:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 3px 6px;
            font-size: 0.68rem;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 20;
            pointer-events: none;
        }

        .bars-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* ER Gauge Section */
        .er-box {
            background: rgba(9, 13, 22, 0.65);
            border-radius: 14px;
            padding: 1rem;
            margin-top: 0.4rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .er-title-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.6rem;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fill-low { background: linear-gradient(90deg, #059669, #10b981); }
        .fill-medium { background: linear-gradient(90deg, #d97706, #f59e0b); }
        .fill-high { background: linear-gradient(90deg, #dc2626, #ef4444); }

        /* Hospital List Toggle & Detail */
        .hospital-toggle-btn {
            width: 100%;
            margin-top: 0.8rem;
            padding: 0.65rem;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.28);
            color: #60a5fa;
            border-radius: 12px;
            font-size: 0.83rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .hospital-toggle-btn:hover {
            background: rgba(59, 130, 246, 0.22);
            color: #ffffff;
            border-color: rgba(59, 130, 246, 0.5);
        }

        .hospital-list {
            display: none;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            max-height: 240px;
            overflow-y: auto;
        }

        .hospital-list.open {
            display: block;
        }

        .hospital-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.55rem 0.7rem;
            border-radius: 10px;
            font-size: 0.83rem;
            background: rgba(255, 255, 255, 0.035);
            margin-bottom: 0.45rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: background 0.15s;
        }

        .hospital-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .hospital-name {
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .hospital-beds {
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .hospital-beds.low-beds { color: #f87171; }
        .hospital-beds.mid-beds { color: #fbbf24; }
        .hospital-beds.good-beds { color: #34d399; }

        .hospital-list::-webkit-scrollbar { width: 4px; }
        .hospital-list::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.15); border-radius: 4px; }
        .hospital-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 4px; }

        @media (max-width: 640px) {
            .filter-wrap { flex-direction: column; }
            .brand-text h1 { font-size: 1.8rem; }
            .district-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- 메인 관제 센터 헤더 (중앙 정렬) -->
        <header class="header">
            <div class="brand">
                <i class="fa-solid fa-chart-line brand-icon"></i>
                <div class="brand-text">
                    <h1>SEOUL <span>AI EMERGENCY & POPULATION PREDICT</span></h1>
                    <p>서울특별시 25개 자치구 실시간 유동인구 · 24시간 밀집 예측 · 사고 위험지역 · A-Z 응급 병상</p>
                </div>
            </div>
            <div class="header-status">
                <span class="live-badge"><span class="dot"></span> 24H PREDICTIVE AI DENSITY MODEL</span>
                <span class="clock" id="clock"><i class="fa-regular fa-clock"></i> --:--:--</span>
            </div>
        </header>

        <!-- 핵심 요약 매트릭스 -->
        <section class="summary-bar">
            <div class="summary-card purple">
                <i class="fa-solid fa-users-viewfinder sc-icon"></i>
                <span class="sc-label">서울 총 유동인구</span>
                <strong class="sc-val" id="total-pop-count">0명</strong>
            </div>
            <div class="summary-card danger">
                <i class="fa-solid fa-triangle-exclamation sc-icon"></i>
                <span class="sc-label">🚨 사고 위험지역 (45만↑)</span>
                <strong class="sc-val" id="accident-risk-count">0곳</strong>
            </div>
            <div class="summary-card cyan">
                <i class="fa-solid fa-business-time sc-icon"></i>
                <span class="sc-label">⚠️ 피크시간 사고 주의 (예측)</span>
                <strong class="sc-val" id="peak-risk-count">0곳</strong>
            </div>
            <div class="summary-card warning">
                <i class="fa-solid fa-circle-exclamation sc-icon"></i>
                <span class="sc-label">응급실 혼잡 구</span>
                <strong class="sc-val" id="high-er-count">0곳</strong>
            </div>
            <div class="summary-card success">
                <i class="fa-solid fa-bed-pulse sc-icon"></i>
                <span class="sc-label">서울 총 응급 가용 병상</span>
                <strong class="sc-val" id="total-beds-count">0석</strong>
            </div>
        </section>

        <!-- 컨트롤 패널 (검색 / 정렬 / 조건 필터) -->
        <section class="control-panel">
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="25개 자치구 또는 병원 이름 검색 (예: 강남구, 종로구, 서울대병원, 신촌세브란스...)">
            </div>
            <div class="filter-wrap">
                <select id="zone-filter">
                    <option value="all">전체 권역 보기 (25개 자치구)</option>
                    <option value="도심권">도심권 (종로, 중구, 용산)</option>
                    <option value="동북권">동북권 (성동, 광진, 동대문, 중랑, 성북, 강북, 도봉, 노원)</option>
                    <option value="서북권">서북권 (은평, 서대문, 마포)</option>

                        const barHeightPercent = Math.max(12, Math.round((pop / maxPopIn24H) * 100));
                        const isCurrentHr = hr === currentHour;
                        const isPeakHr = hr === peakHour;

                        let barColClass = "bar-col";
                        if (isCurrentHr) barColClass += " now";
                        else if (isPeakHr) barColClass += " peak";

                        const tooltipText = `${hr.toString().padStart(2, '0')}시: ${pop.toLocaleString()}명 ${isCurrentHr ? '(현재)' : ''}`;

                        return `
                            <div class="${barColClass}" style="height: 100%;" data-tooltip="${tooltipText}">
                                <div class="bar-fill" style="height: ${barHeightPercent}%;"></div>
                            </div>
                        `;
                    }).join("");

                    // 소속 병원 A-Z HTML
                    const hospitalItemsHTML = item.hospitals.map(h => {
                        const hRatio = (h.avail / h.total) * 100;
                        let bedColorClass = "good-beds";
                        if (hRatio < 20) bedColorClass = "low-beds";
                        else if (hRatio < 45) bedColorClass = "mid-beds";

                        return `
                            <div class="hospital-item">
                                <span class="hospital-name"><i class="fa-solid fa-square-h" style="color:var(--color-blue)"></i> ${h.name}</span>
                                <span class="hospital-beds ${bedColorClass}">${h.avail}석 / ${h.total}석</span>
                            </div>
                        `;
                    }).join("");

                    const card = document.createElement("div");
                    card.className = `district-card ${isAccidentDanger ? 'accident-danger-card' : ''}`;
                    card.innerHTML = `
                        <div>
                            <!-- 경고 알림 바 -->
                            ${isAccidentDanger ? `
                                <div class="accident-alert-banner">
                                    <i class="fa-solid fa-triangle-exclamation"></i>
                                    <span>🚨 현재 인구 과밀 - 실시간 사고 위험 주의지역</span>
                                </div>
                            ` : isPeakRisk ? `
                                <div class="accident-alert-banner" style="background: linear-gradient(90deg, rgba(168, 85, 247, 0.25), rgba(59, 130, 246, 0.25)); border-color: rgba(168, 85, 247, 0.5); color: #e9d5ff;">
                                    <i class="fa-solid fa-clock-rotate-left"></i>
                                    <span>⚠️ 오늘 피크타임(${peakHour.toString().padStart(2, '0')}시) 밀집 사고 경보 지역</span>
                                </div>
                            ` : ''}

                            <div class="card-header">
                                <div class="district-title">
                                    <span class="district-name">${item.name}</span>
                                    <span class="zone-tag">${item.zone}</span>
                                </div>
                                <span class="risk-badge ${item.risk}">응급 ${item.riskText}</span>
                            </div>

                            <!-- 실시간 유동인구 지표 -->
                            <div class="pop-banner ${popBannerClass}">
                                <div class="pop-info">
                                    <span class="pop-label">${popIcon} 실시간 유동인구 (${currentHour}시)</span>
                                    <div class="pop-value-row">
                                        <span class="pop-value">${currentPop.toLocaleString()} 명</span>
                                        <span class="trend-delta ${isUp ? 'up' : 'down'}">
                                            ${isUp ? '▲ +' : '▼ '}${deltaPercent}%
                                        </span>
                                    </div>
                                </div>
                                ${popStatusBadge}
                            </div>

                            <!-- 24시간 인구 밀집 예측 차트 토글 버튼 -->
                            <button class="chart-toggle-btn" onclick="togglePredictionChart(${index})">
                                <i class="fa-solid fa-chart-simple"></i> 
                                🕒 24시간 인구 밀집 예측 그래프 보기
                                <i class="fa-solid fa-chevron-down" id="chart-chevron-${index}" style="transition: transform 0.2s ease;"></i>
                            </button>

                            <!-- 24시간 예측 아코디언 박스 -->
                            <div class="prediction-box" id="prediction-box-${index}">
                                <div class="peak-tags-row">
                                    <span class="text-xs text-slate-400">⚡ 피크 예측: <strong class="text-purple-300">${peakHour.toString().padStart(2, '0')}시 (${maxPopIn24H.toLocaleString()}명)</strong></span>
                                    <span class="peak-tag"><i class="fa-solid fa-bolt"></i> ${item.peakInfo}</span>
                                </div>
                                <div class="bars-container">
                                    ${barsHTML}
                                </div>
                                <div class="bars-labels">
                                    <span>00시</span>
                                    <span>06시</span>
                                    <span class="text-amber-400 font-bold">12시</span>
                                    <span>18시</span>
                                    <span>24시</span>
                                </div>
                                <p class="text-xs text-slate-400 mt-2 text-center">
                                    <span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1"></span>빨강: 현재시간 | 
                                    <span class="inline-block w-2 h-2 rounded-full bg-purple-500 mx-1"></span>보라: 최고피크
                                </p>
                            </div>

                            <div class="info-group">
                                <span>상주 등록인구</span>
                                <strong>${item.residentPop}</strong>
                            </div>

                            <!-- 가용 응급 병상 게이지 -->
                            <div class="er-box">
                                <div class="er-title-row">
                                    <span>가용 응급 병상</span>
                                    <strong>${avail}석 / ${total}석 (${ratio}%)</strong>
                                </div>
                                <div class="progress-track">
                                    <div class="progress-fill ${fillClass}" style="width: ${ratio}%"></div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <!-- A-Z Hospital Accordion Button -->
                            <button class="hospital-toggle-btn" onclick="toggleHospitalList(${index})">
                                <i class="fa-solid fa-list-check"></i> 
                                소속 병원 A-Z 병상 상세 보기 (${item.hospitals.length}곳)
                                <i class="fa-solid fa-chevron-down" id="chevron-${index}" style="transition: transform 0.2s ease;"></i>
                            </button>

                            <div class="hospital-list" id="hospital-list-${index}">
                                ${hospitalItemsHTML}
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            function filterAndSortData() {
                const query = searchInput.value.trim().toLowerCase();
                const selectedZone = zoneFilter.value;
                const selectedRisk = riskFilter.value;
                const selectedSort = sortFilter.value;

                let filtered = seoulDistricts.filter(item => {
                    const matchesDistrict = item.name.toLowerCase().includes(query);
                    const matchesHospital = item.hospitals.some(h => h.name.toLowerCase().includes(query));
                    const matchesSearch = matchesDistrict || matchesHospital;

                    const matchesZone = selectedZone === "all" || item.zone === selectedZone;

                    let matchesRisk = true;
                    if (selectedRisk === "accident") {
                        matchesRisk = item.curve[currentHour] >= ACCIDENT_RISK_THRESHOLD;
                    } else if (selectedRisk === "peak-danger") {
                        matchesRisk = Math.max(...item.curve) >= 480000;
                    } else if (selectedRisk !== "all") {
                        matchesRisk = item.risk === selectedRisk;
                    }

                    return matchesSearch && matchesZone && matchesRisk;
                });

                // Sorting
                if (selectedSort === "pop-desc") {
                    filtered.sort((a, b) => b.curve[currentHour] - a.curve[currentHour]);
                } else if (selectedSort === "pop-asc") {
                    filtered.sort((a, b) => a.curve[currentHour] - b.curve[currentHour]);
                } else if (selectedSort === "delta-desc") {
                    filtered.sort((a, b) => {
                        const prevHr = (currentHour - 1 + 24) % 24;
                        const aDelta = (a.curve[currentHour] - a.curve[prevHr]) / a.curve[prevHr];
                        const bDelta = (b.curve[currentHour] - b.curve[prevHr]) / b.curve[prevHr];
                        return bDelta - aDelta;
                    });
                } else if (selectedSort === "beds-asc") {
                    filtered.sort((a, b) => {
                        const aAvail = a.hospitals.reduce((sum, h) => sum + h.avail, 0);
                        const bAvail = b.hospitals.reduce((sum, h) => sum + h.avail, 0);
                        return aAvail - bAvail;
                    });
                }

                renderCards(filtered);

                // 검색어 입력 시 자동 펼침
                if (query.length > 0) {
                    filtered.forEach((_, idx) => {
                        const pBox = document.getElementById(`prediction-box-${idx}`);
                        const hList = document.getElementById(`hospital-list-${idx}`);
                        if (pBox) pBox.classList.add('open');
                        if (hList) hList.classList.add('open');
                    });
                }
            }

            // 차트 토글
            window.togglePredictionChart = function(index) {
                const box = document.getElementById(`prediction-box-${index}`);
                const chevron = document.getElementById(`chart-chevron-${index}`);
                if (box) {
                    box.classList.toggle('open');
                    if (chevron) {
                        chevron.style.transform = box.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
                    }
                }
            };

            // 병원 토글
            window.toggleHospitalList = function(index) {
                const list = document.getElementById(`hospital-list-${index}`);
                const chevron = document.getElementById(`chevron-${index}`);
                if (list) {
                    list.classList.toggle('open');
                    if (chevron) {
                        chevron.style.transform = list.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
                    }
                }
            };

            // Event Binding
            searchInput.addEventListener("input", filterAndSortData);
            zoneFilter.addEventListener("change", filterAndSortData);
            riskFilter.addEventListener("change", filterAndSortData);
            sortFilter.addEventListener("change", filterAndSortData);

            // Initialize
            updateSummaryData();
            renderCards(seoulDistricts);
        });
    </script>
</body>
</html>
