<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <script>
        function makeStudent(name, kor , mat, eng){
            let resultObj = {
                'name':name,
                'kor':kor,
                'mat':mat,
                'eng':eng,
                'getSum':function(){
                    return this.kor + this.mat + this.eng;
                },
                'getAvg':function(){
                    return Math.round(this.getSum() / 3 * 10)/10;
                },
                'toString':function(){
                    let output = '';
                    for(let key in this){
                    if(key!='getSum' && key!='getAvg' && key!='toString'){
                        output += key + ':' + this[key] + ' &nbsp; ';
                    }else if(key=='getSum' || key=='getAvg'){
                        output += key.substring(3).toUpperCase() + ':' + this[key]() + ' &nbsp; ';
                    } //if
                }  //for
                return output;
                },
            };
            return resultObj;
        }
        let students = [];
        students.push(makeStudent('가길동', 99, 98, 97));
        students.push(makeStudent('나길동', 89, 99, 87));
        students.push(makeStudent('다길동', 79, 98, 77));
        students.push(makeStudent('라길동', 69, 97, 87));
        students.push(makeStudent('마길동', 59, 96, 57));
        students.push(makeStudent('바길동', 0, 100, 0));
        students.forEach(element => document.write(element + '<hr>'));
    </script>
</head>
<body>
</body>
</html>
