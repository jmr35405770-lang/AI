<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>점수 누적 프로그램</title>
</head>
<body>

    <script>
        let totalInputCount = 0;
        let sum = 0; 
        let validCount = 0;
        let invalidCount = 0;
        while (confirm("누적하시겠습니까?")) {
            let input = prompt("누적할 점수?");
            totalInputCount++;
            let score = Number(input);
            if (input !== null && input.trim() !== "" && !isNaN(score) && score >= 0 && score <= 100) {
                sum += score;
                validCount++;
            } else {
                invalidCount++;
            }
        }
        document.write(`<h2>${totalInputCount}번 입력</h2>`);
        document.write(`<h2>누적점수 : ${sum}</h2>`);
        document.write(`<h2>점수를 제대로 입력한 횟수 : ${validCount}</h2>`);
        document.write(`<h2>점수를 잘못 입력한 횟수 : ${invalidCount}</h2>`);
    </script>
</body>
</html>
