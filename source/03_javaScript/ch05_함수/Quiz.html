<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        body{
            background-image: url(ch05_img/img01.png);
            background-size: 100%;
            font-size: 2.5em;
            color: yellow;
        }
    </style>
    <script>
        // img01.png(노란색),img02.png(파란색), img03.png(하얀색)
        let sec = 0; //몇초가 지났는지 저장 변수
        const color = ['yellow', 'blue', 'white'];
        const img = ['url(ch05_img/img01.png)',
                        'url(ch05_img/img02.png)',
                        'url(ch05_img/img03.png)'];
        
        document.write(`${new Date().toLocaleString()} <br> ${sec}초`);
        var id = setInterval(() => {
            sec++;
            document.body.innerHTML = new Date().toLocaleString() + '<br>' + sec + '초' ;
            document.body.style.backgroundImage = img[sec%3];
            document.body.style.color = color[sec%3];
        }, 1000);
        setTimeout(() => {
            clearInterval(id)
        }, 10000);
    </script>
</head>
<body>
    
</body>
</html>
