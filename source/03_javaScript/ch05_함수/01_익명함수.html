<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <script>
        let i = 10;
        document.write(i+'<br>');
        // functionVar(10, 20); 익명함수는 정의전에 사용 불가
        let functionVar = function(i, j){
            alert(`함수 표현식 test i=${i}, j=${j}`);
        };
        functionVar(10, 20);
        functionVar = function(){}; //함수표현식
        functionVar = (i ,j) => {  //함수 화살표 함수
            alert(i+j);
        }; 
        functionVar(10, 20);
    </script>
</head>
<body>
    
</body>
</html>
