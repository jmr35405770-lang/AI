<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        div{border:1px solid gray;}
        #header, #footer{ /*id선택자(#id)*/
            width:600px;
            margin:0 auto;
            background-color:yellow;
            text-align: center;
/*            text-decoration:underline; 밑줄 */
        }
        #wrap{
            width: 600px;
            margin: 0 auto;
            background-color:aqua;
            overflow:hidden; /* 부모단에 */
            text-align: center; /* 가운데 정렬 (글씨,이미지)*/
        }
        #wrap #content{
            float:left; /*블록형태그를 수평으로*/
            width:348px; /*comtent가로 = width(348px) + border(1px*2) = 350*/
            height:300px;
        }
        #wrap #content .odd{/*class선택자(.)*/
            font-size:1.5em;/*원래크기의 1.5배*/
            }
        #wrap #content .menu2{font-weight:bold;}
        #warp #side_banner {
            float: left; /*블록형태그를 수평으로*/
            width: 248px; /* 가로 = width(248px) + border(1px*2) = 250*/
            height: 300px;
        }
        img {
            width: 150px;
        }
        #footer{
            clear:both;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>HEADER</h1>
    </div>
    <div id="wrap">
         <div id="content">
             <h2>CONTENT</h2>
             <ul>
                <li class="menu1 odd">MENU1</li>
                <li class="menu2">MENU2</li>
                <li class="menu3 odd">MENU3</li>
                <li class="menu4">MENU4</li>
                <li class="menu5 odd">MENU5</li>
             </ul>
         </div>
        <div id="side_banner">
            <h2>BANNER</h2>
            <a href="http://www.daum.net">
                <img src="https://ditoday.com/wp-content/uploads/2025/01/img-3.jpg" alt="다음로고" />
            </a>
        </div>
    </div>
    <div id="footer">
        <h1>FOOTER</h1>
    </div>
</body>
</html>
