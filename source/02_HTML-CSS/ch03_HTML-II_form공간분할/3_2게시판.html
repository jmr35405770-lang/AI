<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <form name="frm">
        <!--action="" method="get"-->
        <table>
            <caption><h2>게시판</h2></caption>
            <tr>
                <td>제목<span>*</span></td>
                <td><input type="text" name="title" size="30" placeholder="필수입력" required="required" /></td>
            </tr>
            <tr>
                <td>작성자<span>*</span></td>
                <td><input type="text" name="name" size="30" placeholder="필수입력" required="required" minlength="2" /></td>
            </tr>
            <tr>
                <td>본문</td>
                <td><textarea name="content" cols="30" rows="5"></textarea></td>
            </tr>
            <tr>
                <td>첨부파일</td>
                <td><input type="file" name="filename" /></td>
            </tr>
            <tr>
                <th colspan="2">
                    <input type="submit" value="글쓰기" />
                    <input type="reset" />
                </th>
            </tr>
            <tr>
                서울시 서대문구 신촌로 141 은하빌딩 203호
                Copyright ⓒ xx All rights reserved
            </tr>
        </table>
    </form>
</body>
</html>
