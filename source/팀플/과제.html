<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울특별시 구별 위험도 및 응급실 실시간 현황</title>
    <!-- Pretendard 폰트 & FontAwesome 아이콘 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<style>
    <style>
        header{bottom: auto;}
    </style>
</style>
<body>
    <div class="dashboard-wrapper">
        <!-- 상단 헤더 -->
        <header class="header">
            <div class="brand">
                <i class="fa-solid fa-hospital-user brand-icon"></i>
                <div class="brand-text">
                    <h1>SEOUL <span>EMERGENCY HUB</span></h1>
                    <p>서울특별시 25개 자치구 실시간 의료 및 위험도 관제 System</p>
                </div>
            </div>
            <div class="header-status">
                <span class="live-badge"><span class="dot"></span> LIVE UPDATE</span>
                <span class="clock" id="clock"><i class="fa-regular fa-clock"></i> --:--:--</span>
            </div>
        </header>

        <!-- 요약 지표 영역 -->
        <section class="summary-bar">
            <div class="summary-card">
                <span class="sc-label">관제 자치구</span>
                <strong class="sc-val">25개 구</strong>
            </div>
            <div class="summary-card danger">
                <span class="sc-label">고위험 자치구</span>
                <strong class="sc-val" id="high-risk-count">0곳</strong>
            </div>
            <div class="summary-card">
                <span class="sc-label">서울 총 응급 가용 병상</span>
                <strong class="sc-val" id="total-beds-count">0석</strong>
            </div>
        </section>

        <!-- 검색 및 권역 필터 -->
        <section class="control-panel">
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="자치구 검색 (예: 강남구, 종로구, 마포구...)">
            </div>
            <div class="filter-wrap">
                <select id="zone-filter">
                    <option value="all">전체 권역 보기</option>
                    <option value="도심권">도심권 (종로/중구/용산)</option>
                    <option value="동북권">동북권 (성동/광진/동대문 등)</option>
                    <option value="서북권">서북권 (은평/서대문/마포)</option>
                    <option value="서남권">서남권 (양천/강서/구로 등)</option>
                    <option value="동남권">동남권 (서초/강남/송파/강동)</option>
                </select>
                <select id="risk-filter">
                    <option value="all">전체 위험도</option>
                    <option value="high">🚨 위험 (High)</option>
                    <option value="medium">⚠️ 주의 (Medium)</option>
                    <option value="low">✅ 정상 (Low)</option>
                </select>
            </div>
        </section>

        <!-- 서울 자치구 그리드 -->
        <section class="district-grid" id="district-grid">
            <!-- JS 동적 생성 -->
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
